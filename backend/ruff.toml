line-length = 140
target-version = "py312"
extend-exclude = ["alembic/versions"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",   # assert is fine in tests and for narrowing
    "S311",   # random is used for demo data, not security
    "B008",   # FastAPI dependencies in defaults
    "RUF001", # emoji / typographic characters in user-facing strings
    "RUF002",
    "RUF003",
    "SIM117",
]

[lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"app/seed/*" = ["B023"]  # closures bind loop values through default arguments
